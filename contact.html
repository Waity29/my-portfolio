  <main>
    <header class="contact-hero">
      <h1>Let's work together.</h1>
    </header>

    <section>
      <div class="grid grid-side contact-grid">
        <div class="contact-left">
          <h4>EMAIL</h4>
          <p class="contact-email">
            <span aria-label="Email waityigop@gmail.com"><i class="fas fa-envelope"></i> waityigop@gmail.com</span>
          </p>
          <h4 style="margin-top: 20px;">PHONE</h4>
          <p class="contact-phone">
            <span aria-label="Phone +639949127257"><i class="fas fa-phone"></i> +63 994 912 7257</span>
          </p>

          
        </div>

        <div class="contact-right">
          <form id="contactForm" class="contact-form" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" autocomplete="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Your message" required></textarea>

            <button type="submit" class="btn">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>
